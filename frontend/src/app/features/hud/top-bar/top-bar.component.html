<div class="top-bar">
  <!-- Hearts -->
  <div class="hud-section">
    <img [src]="heartImage" alt="Hearts" class="heart-img" />
  </div>

  <!-- Potions -->
  <div class="hud-section">
    <img [src]="potionImage" alt="Potions" class="potion-img" />
  </div>

  <!-- Coins -->
  <div class="hud-section coins-section">
    <img src="/assets/ui/coin.png" alt="Coins" class="coin-img" />
    <div class="coin-count">x{{ coins }}</div>
  </div>
</div>
